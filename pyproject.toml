[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sage"
version = "0.1.0"
description = "Speculative Audio Generation Engine: real-time sound effects for games."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TC-al" }]
keywords = ["game-audio", "neural-audio", "sound-effects", "speculative-prefetch", "real-time"]
dependencies = [
    "numpy>=1.24,<2.5",
]

[project.optional-dependencies]
stableaudio = ["torch>=2.1", "stable-audio-tools>=0.0.16", "einops>=0.7"]
dev = ["pytest>=7.4"]

[project.scripts]
sage-sim = "sage.cli:main_sim"
sage-bake = "sage.cli:main_bake"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
